# Sirius 人格模拟器的 v1 部署：两个容器。
#
# 为什么分开而不是单镜像双进程：AMKR 与 Sirius 的升级节奏、配置、镜像
# 维护者都不同，合在一起会让"只升 AMKR"变成重打整个镜像。单镜像双进程
# 留作后续的分发优化，不是 v1 目标（docs/llm-amkr.md §5）。
#
# 用法：
#   cp .env.example .env      # 填 AMKR_API_KEY 等
#   docker compose up --build
#
# 只暴露 Sirius 一个端口，且**绑在宿主回环**（见 ports 的说明）。
#
# 项目名必须小写：compose 拒绝大写（`-p SiriusRealLife` 会报
# "must consist only of lowercase alphanumeric characters..."）。
# 这里写死 name，让项目名不随目录名漂移；`-p` 仍可覆盖它，
# 部署时统一用：docker compose -p siriusreallife ...
name: siriusreallife

services:
  amkr:
    # 锁死版本，不要用 latest：/amkr/ 反代依赖前端从页面路径推导 API 基址
    # 的行为（apiBase()），该行为在版本之间变过（docs/llm-amkr.md §4）。
    #
    # ⚠️ v4.1.0 **没有** apiBase()，其前端把请求发到根绝对路径
    # （fetch("/api/settings")），挂在 /amkr/ 下不会经过反代。等 AMKR
    # 发布含该改动的版本后改成那个 tag。改动前 /amkr/ 页面能打开，
    # 但管理请求会落到 Sirius 自己的路由上（表现为 404 或空响应）。
    #
    # 用变量是为了让"镜像从哪来"可切换而不用改本文件：默认取的 ghcr
    # 镜像目前是**私有**的，匿名与无凭据环境一律 denied（实测 403）。
    # 换来源时在 .env 里覆盖 AMKR_IMAGE 即可，见部署文档。
    image: ${AMKR_IMAGE:-ghcr.io/sparrived/auto-model-key-router:v4.1.0}
    restart: unless-stopped
    # ⚠️ 不要加 `--no-ops`。实测 v4.1.0 的 argparse 里**没有**这个参数，
    # 带上会 "unrecognized arguments" 并 exit 2 无限重启。
    #
    # `--no-ops` 目前只存在于 AMKR 的**本地未提交改动**（main.py 新增了
    # 该开关），既不在 PyPI 4.1.0，也不在 origin/master，因此也不可能在
    # ghcr 镜像里。等它随版本发布后再改成
    # ["amkr","--host","0.0.0.0","--serve-foreground","--no-ops"]。
    # 在此之前运维接口由 Sirius 反代侧 403 兜住
    # （internal/transport/proxy.go 的 blockedOpsPath，见 docs/llm-amkr.md §4）。
    #
    # `--serve-foreground` 是前台模式，容器里必须用它：
    # 另一个 `--serve` 会 fork 到后台并让主进程退出，容器随即被判为结束
    # 而无限重启（实测 RestartCount 涨到 9）。
    # 注意该参数在 4.1.0 里是 `help=argparse.SUPPRESS`，`--help` 里看不到，
    # 别因为"帮助里没有"就以为不存在。
    command: ["amkr", "--host", "0.0.0.0", "--serve-foreground"]
    environment:
      # 容器内配置、metrics、日志都在 /data 下（AMKR 镜像用 XDG_CACHE_HOME
      # 把状态推到 /data/auto-model-key-router）。
      XDG_CACHE_HOME: /data
      TZ: Asia/Shanghai
    volumes:
      # 命名卷：删容器不丢配置。首次启动会生成配置与 local_api_key，
      # 用 `docker compose exec amkr amkr --config /data/auto-model-key-router/router-config.json --get-key` 取。
      - amkr-data:/data
    extra_hosts:
      # AMKR 的 provider 可以指向**宿主上已发布端口**的服务（例如同一台
      # 机器上的另一个模型网关）。Linux 上 host.docker.internal 不会自动
      # 存在，必须显式声明 host-gateway，否则容器里解析不了这个名字。
      #
      # ⚠️ 安全：这让容器能访问宿主的所有监听端口。这里只发布回环端口，
      # 所以风险等价于容器本身；若宿主的 listen 绑到了 0.0.0.0 则不然。
      - "host.docker.internal:host-gateway"
    # 刻意**不**发布端口：Sirius 通过服务名 amkr:8000 访问它。
    # AMKR 容器内固定监听 0.0.0.0（否则端口映射进不去），所以更要避免
    # 把 8000 映射出去 —— 那等于把完整管理权限暴露给局域网。
    expose:
      - "8000"
    healthcheck:
      # /health 免鉴权，是官方推荐的就绪判断（不要用 / 或猜端口）。
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  sirius:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      amkr:
        # 等 AMKR 真的能响应健康检查再启动，避免首轮 LLM 调用全部失败。
        condition: service_healthy
    environment:
      AMKR_BASE_URL: http://amkr:8000
      AMKR_API_KEY: ${AMKR_API_KEY:?请在 .env 里设置 AMKR_API_KEY}
      AMKR_MODEL: ${AMKR_MODEL:-unified-model}
      AMKR_TIMEOUT: ${AMKR_TIMEOUT:-120s}
      AMKR_TASK_DISPATCH: ${AMKR_TASK_DISPATCH:-}
      AMKR_TASK_MONOLOGUE: ${AMKR_TASK_MONOLOGUE:-}
      AMKR_TASK_TOOL_READ: ${AMKR_TASK_TOOL_READ:-}
      # 容器内必须绑 0.0.0.0 才能接收映射进来的流量（Dockerfile 里已设）。
      SIRIUS_ADDR: 0.0.0.0:8080
      # 显式确认"我知道自己在绑非回环地址"。进程无法知道宿主侧映射是否
      # 只开了回环，所以这条安全线只能靠部署方声明（AGENTS.md §4）。
      # 与下面的 ports 写法是一对，缺了它服务会拒绝启动。
      SIRIUS_ALLOW_NON_LOOPBACK: "1"
      SIRIUS_TICK_INTERVAL: ${SIRIUS_TICK_INTERVAL:-1s}
      # 没有 SIRIUS_SEED：框架里已经没有随机数了（AGENTS.md R3）。
      # 可复现性来自决策日志（模型给的理由 + 当时的候选清单），不来自种子。
      SIRIUS_START_TICK: ${SIRIUS_START_TICK:-420}
      SIRIUS_LOG_LEVEL: ${SIRIUS_LOG_LEVEL:-info}
      # 内心独白的最小间隔（tick）。这是唯一的 LLM 成本闸门：
      # 独白由状态进入触发，而状态平均只停留几 tick，不节流等于每次
      # 状态转移都发一次调用。默认 30（游戏内半小时）。
      SIRIUS_MONOLOGUE_EVERY: ${SIRIUS_MONOLOGUE_EVERY:-30}
      TZ: Asia/Shanghai
    ports:
      # ⚠️ 只绑宿主回环。写成 "8080:8080" 会把 /amkr/（AMKR 完整管理权限）
      # 暴露给整个网络 —— Sirius 自身还没有鉴权。
      #
      # 宿主端口用变量：生产服务器上 8080 已被别的服务占用（实测
      # sirius-pulse-v2-test 以 host 网络占着 0.0.0.0:8080），因此那里
      # 用 SIRIUS_HOST_PORT=18080。本机开发保持 8080 不动。
      - "127.0.0.1:${SIRIUS_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  amkr-data:
