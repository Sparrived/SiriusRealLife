# Sirius 人格模拟器的部署：**只剩 sirius 一个服务**。
#
# AMKR 已于 2026-09-19 拆成独立部署（/opt/amkr/docker-compose.yml，项目名 amkr）。
# 为什么拆：AMKR 的升级节奏、镜像来源、状态（配置 + metrics 库）都与 Sirius 无关，
# 合在一个项目里会让「只升 AMKR」变成动整个 stack，两个服务的生命周期也被绑死。
# 单镜像双进程仍留作后续的分发优化（docs/llm-amkr.md §5）。
#
# 连通方式：两边共用一个独立网络 amkr-net（由 AMKR 那个项目创建，本文件以 external
# 引用）。AMKR 在该网络上保留别名 `amkr`，因此 AMKR_BASE_URL 不用改。
#
# 用法（**在本目录执行，不要加 -p**；本文件已写死 `name:`，而 `-p` 在别的目录执行会
# 按项目标签误伤另一个项目的容器 —— 实测在 /opt/amkr 里跑 `-p siriusreallife down`
# 会拆掉 sirius 的容器）：
#   cp .env.example .env      # 填 AMKR_API_KEY 等
#   docker compose up --build
#
# 只暴露 Sirius 一个端口，且**绑在宿主回环**（见 ports 的说明）。
#
# 项目名必须小写：compose 拒绝大写（`name: SiriusRealLife` 会报
# "must consist only of lowercase alphanumeric characters..."）。
name: siriusreallife

services:
  sirius:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # 这里**曾经**有 depends_on: amkr(service_healthy)，用来等 AMKR 真的能响应健康
    # 检查再启动，避免首轮 LLM 调用全部失败。AMKR 拆成独立项目后这条跨项目依赖不再
    # 成立（compose 的 depends_on 只在同一项目内生效），只能去掉。
    #
    # 影响与对策：Sirius 可能比 AMKR 先起来，启动瞬间的 LLM 调用会失败（连接被拒），
    # AMKR 就绪后自愈；Sirius 有重试，因此是可接受的降级。真要消除这个窗口，用
    # `cd /opt/amkr && docker compose up -d` -> 等 /health 200 -> 再起 sirius 的顺序，
    # 而不是把两个服务再绑回一个项目。
    environment:
      # 走共享网络的服务名别名（AMKR 容器在 amkr-net 上叫 amkr）。
      # ⚠️ 不要改成 127.0.0.1:28881：容器里的 127.0.0.1 指向 Sirius 自己。
      AMKR_BASE_URL: http://amkr:8000
      AMKR_API_KEY: ${AMKR_API_KEY:?请在 .env 里设置 AMKR_API_KEY}
      AMKR_MODEL: ${AMKR_MODEL:-unified-model}
      AMKR_TIMEOUT: ${AMKR_TIMEOUT:-120s}
      AMKR_TASK_DISPATCH: ${AMKR_TASK_DISPATCH:-}
      AMKR_TASK_MONOLOGUE: ${AMKR_TASK_MONOLOGUE:-}
      AMKR_TASK_TOOL_READ: ${AMKR_TASK_TOOL_READ:-}
      # 容器内必须绑 0.0.0.0 才能接收映射进来的流量（Dockerfile 里已设）。
      SIRIUS_ADDR: 0.0.0.0:8080
      # 显式确认"我知道自己在绑非回环地址"。进程无法知道宿主侧映射是否
      # 只开了回环，所以这条安全线只能靠部署方声明（AGENTS.md §4）。
      # 与下面的 ports 写法是一对，缺了它服务会拒绝启动。
      SIRIUS_ALLOW_NON_LOOPBACK: "1"
      SIRIUS_TICK_INTERVAL: ${SIRIUS_TICK_INTERVAL:-1s}
      # 没有 SIRIUS_SEED：框架里已经没有随机数了（AGENTS.md R3）。
      # 可复现性来自决策日志（模型给的理由 + 当时的候选清单），不来自种子。
      SIRIUS_START_TICK: ${SIRIUS_START_TICK:-420}
      SIRIUS_LOG_LEVEL: ${SIRIUS_LOG_LEVEL:-info}
      # 内心独白的最小间隔（tick）。这是唯一的 LLM 成本闸门：
      # 独白由状态进入触发，而状态平均只停留几 tick，不节流等于每次
      # 状态转移都发一次调用。默认 30（游戏内半小时）。
      SIRIUS_MONOLOGUE_EVERY: ${SIRIUS_MONOLOGUE_EVERY:-30}
      # HTTP Basic 鉴权。两个都填才生效，只填一个进程会拒绝启动——
      # 半开的鉴权比没有更危险（以为配了密码，实际不校验）。
      #
      # 留空 = 不启用，适合只绑宿主回环的本机开发。**经隧道/反代对外时
      # 必须填**：/amkr/ 反代等同于 AMKR 的完整管理权限，能读到上游 key。
      # 这正是 AGENTS.md §4 那条"没有鉴权只能绑回环"的解法。
      SIRIUS_AUTH_USER: ${SIRIUS_AUTH_USER:-}
      SIRIUS_AUTH_PASS: ${SIRIUS_AUTH_PASS:-}
      TZ: Asia/Shanghai
    networks:
      # 加入 AMKR 所在的网络才能用 `amkr` 这个名字解析到它。
      # 本服务不需要发布任何端口到这个网络：它只是去连 AMKR。
      # 同时保留项目默认网络 default —— 拆分前 sirius 用的就是它，
      # 只加不减，出问题时的变量就只有一个。
      - default
      - amkr-net
    ports:
      # ⚠️ 只绑宿主回环。唯一被允许的对外入口是有鉴权与 TLS 的那条
      # （Cloudflare Tunnel → 127.0.0.1:18080）。
      #
      # 即便开了 SIRIUS_AUTH_*，也**不要**把端口直接映射到 0.0.0.0：
      # 那会让 Basic 凭据走明文 HTTP，而隧道那条路是 HTTPS。
      #
      # 宿主端口用变量：生产服务器上 8080 已被别的服务占用（实测
      # sirius-pulse-v2-test 以 host 网络占着 0.0.0.0:8080），因此那里
      # 用 SIRIUS_HOST_PORT=18080。本机开发保持 8080 不动。
      - "127.0.0.1:${SIRIUS_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# ⚠️ 这里**不要**再声明 amkr-data 卷。
#
# AMKR 的数据卷现在由 /opt/amkr/docker-compose.yml 以 external 方式引用。曾在这里
# 留下一句 `volumes:\n  amkr-data:`（拆服务后已无任何服务使用它），但 compose 的
# `down -v` 是按「本文件声明的卷名」删的——**实测**它会把这个正在被 AMKR 使用的卷
# 连数据一起删掉。删掉这句声明，`down -v` 就再也碰不到它。

networks:
  # AMKR 的 compose 拥有这个网络（见 /opt/amkr/docker-compose.yml），
  # 这里以 external 引用它：Sirius 项目的 up/down 不会创建或删除它，
  # 因此 `docker compose down` 不会连带拆掉 AMKR 的网络。
  #
  # 用法一律是 `cd` 到本目录后 `docker compose ...`，**不加 `-p`** —— 本文件已写死
  # `name:`。带 `-p amkr` 之类的参数在别的目录执行会按项目标签误伤另一个项目。
  amkr-net:
    external: true
    name: amkr-net
